<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F0E4D0">
  <meta name="robots" content="noindex">
  <title>연결 확인 · 유하다 헤어</title>
  <link rel="icon" href="/static/icons/favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 28px; background: #FAF5EC; color: #1A1614; font: 15px/1.8 system-ui, sans-serif; }
    main { width: 100%; max-width: 360px; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { margin: 28px 0 12px; font-size: 22px; font-weight: 500; letter-spacing: -.04em; }
    p { margin: 0; color: #4A3F38; word-break: keep-all; }
    a { display: inline-block; margin-top: 28px; padding: 11px 24px; color: #FAF5EC; background: #1A1614; border-radius: 4px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="/static/icons/icon-192.png" alt="유하다 헤어">
    <h1>인터넷 연결을 확인해 주세요</h1>
    <p>회원 정보와 거래는 연결된 상태에서 확인할 수 있습니다.<br>처리 중이던 거래는 연결 후 거래 내역에서 확인해 주세요.</p>
    <a href="/v2/login">연결 후 다시 열기</a>
  </main>
</body>
</html>
