version: "2"
sql:
  - engine: "sqlite"
    queries: "internal/db/queries"
    schema: "migrations"
    gen:
      go:
        package: "dbgen"
        out: "internal/db/dbgen"
        sql_package: "database/sql"
        emit_interface: false
        emit_json_tags: true
        json_tags_case_style: "camel"
        emit_db_tags: false
        emit_empty_slices: true
        emit_prepared_queries: false
        # SQLite에서 INTEGER 0/1로 저장되는 boolean을 bool로 매핑
        overrides:
          - column: "members.is_active"
            go_type: "bool"
          - column: "admin_users.is_active"
            go_type: "bool"

  # V2 operational UI reads/writes the canonical ledger, with additive metadata.
  # Keep existing view/service model names; sqlc model rename keys are singular.
  - engine: "sqlite"
    queries: "internal/v2/db/queries"
    schema: "migrations"
    gen:
      go:
        package: "dbgen"
        out: "internal/v2/db/dbgen"
        sql_package: "database/sql"
        emit_interface: false
        emit_json_tags: true
        json_tags_case_style: "camel"
        emit_db_tags: false
        emit_empty_slices: true
        emit_prepared_queries: false
        rename:
          member: "V2Member"
          transaction: "V2Transaction"
          admin_user: "V2AdminUser"
          kakao_verify_request: "V2KakaoVerifyRequest"
          session: "V2Session"
          membership_plan: "V2MembershipPlan"
          membership: "V2Membership"
          deduct_amount_preset: "V2DeductAmountPreset"
          service_memo_preset: "V2ServiceMemoPreset"
        overrides:
          - column: "members.is_active"
            go_type: "bool"
          - column: "admin_users.is_active"
            go_type: "bool"
          - column: "membership_plans.is_active"
            go_type: "bool"
          - column: "deduct_amount_presets.is_active"
            go_type: "bool"
          - column: "service_memo_presets.is_active"
            go_type: "bool"
